[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hepadiff"
version = "0.2.0"
description = "HepaDiff — perturbation-conditioned masked discrete diffusion for virtual-liver generation and mechanism analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
]

[project.scripts]
hepadiff = "hepadiff.cli:main"

[tool.setuptools.packages.find]
include = ["hepadiff*"]

[tool.setuptools.package-data]
hepadiff = ["data/*.npz", "data/*.npy", "data/*.txt"]
